name: MathDB claim completeness

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: mathdb-claim-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      startsWith(github.event.issue.title, '[Claim Reward]') ||
      contains(github.event.issue.body, '### JSP identifier') ||
      contains(github.event.issue.body, '### MathDB problem link') ||
      contains(github.event.issue.body, '### Categories claimed') ||
      contains(github.event.issue.body, '### Contribution roles') ||
      contains(github.event.issue.body, '### Solution material links') ||
      contains(github.event.issue.body, '### Lean material links') ||
      contains(github.event.issue.body, '### Exposition material links') ||
      contains(github.event.issue.body, '### Review record links')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check contribution roles, availability and links
        run: python3 scripts/check_mathdb_claim.py --event "$GITHUB_EVENT_PATH"
