name: MathDB pilot consistency

on:
  push:
    paths:
      - 'problems/**'
      - 'candidates/README.md'
      - 'awards/README.md'
      - 'scripts/mathdb_pilot.py'
      - 'tests/**'
      - '.github/workflows/mathdb-pilot.yml'
  pull_request:
    paths:
      - 'problems/**'
      - 'candidates/README.md'
      - 'awards/README.md'
      - 'scripts/mathdb_pilot.py'
      - 'tests/**'
      - '.github/workflows/mathdb-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check pilot metadata and catalog links
        run: python3 scripts/mathdb_pilot.py check
      - name: Test pilot validation and rendering
        run: python3 -m unittest discover -s tests -v
