name: Claim Reward (MathDB)
description: Claim a reward for a MathDB pilot problem.
title: "[Claim Reward] JSP-XXXXXX — categories"
body:
  - type: markdown
    attributes:
      value: |
        For the [MathDB pilot](https://github.com/TheJustinSunPrize/awards/blob/main/problems/mathdb-pilot.md), use [mathdb](https://github.com/TheJustinSunPrize/awards/blob/main/docs/award-process-mathdb.md). The official agent submits after activation and qualification checks; the contributor remains the claimant.

  - type: input
    id: problem
    attributes:
      label: JSP identifier
      placeholder: JSP-000001
    validations:
      required: true
  - type: input
    id: catalog_link
    attributes:
      label: Catalog link
      description: Link to this problem in the repository's problem bank.
      placeholder: https://github.com/TheJustinSunPrize/awards/blob/main/problems/catalog-0001-0100.md#JSP-000001
    validations:
      required: true
  - type: input
    id: mathdb_problem
    attributes:
      label: MathDB problem link
      description: Use the confirmed MathDB link recorded in the problem bank.
      placeholder: https://mathdb.com/p/...
    validations:
      required: true
  - type: textarea
    id: actual_claimant
    attributes:
      label: Contributor
      description: Public name, stable MathDB user ID/profile and contribution. Include coauthors and attribution links if applicable; GitHub account is optional.
    validations:
      required: true
  - type: dropdown
    id: categories
    attributes:
      label: Categories claimed
      description: Select only categories that passed the required reviews and qualification checks. Each selected category must have material links below; leave unselected categories blank. An automatic check runs after submission and edits.
      multiple: true
      options:
        - Solution
        - Lean
        - Exposition
    validations:
      required: true
  - type: textarea
    id: solution_records
    attributes:
      label: Solution material links
      description: If claiming Solution, provide links to the mathematical solution or paper.
      placeholder: |
        https://... (solution or paper)
    validations:
      required: false
  - type: textarea
    id: lean_records
    attributes:
      label: Lean material links
      description: If claiming Lean, provide links to the original proof repository and relevant proof files at a fixed commit.
      placeholder: |
        https://github.com/OWNER/REPOSITORY
        https://github.com/OWNER/REPOSITORY/blob/COMMIT/path/to/Proof.lean
    validations:
      required: false
  - type: textarea
    id: exposition_records
    attributes:
      label: Exposition material links
      description: If claiming Exposition, provide links to the article, video or other explanatory materials.
      placeholder: |
        https://... (article, video or other materials)
    validations:
      required: false
  - type: textarea
    id: review_records
    attributes:
      label: Review record links
      description: Link the MathDB review records covering all selected categories, including committee selection for Exposition. Link each shared record only once; detailed evidence can remain in those records.
      placeholder: https://... (review record)
    validations:
      required: true
  - type: textarea
    id: related_records
    attributes:
      label: Related claims or disputes (if any)
      description: Link relevant claims, historical PRs, coauthors or disputes found during the required history check. Leave blank if none.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        The prize team will review the claim and follow up on identity verification and personal confirmation. Submitting this form does not confirm an award.

        See the [award process](https://github.com/TheJustinSunPrize/awards/blob/main/docs/award-process-mathdb.md) for public review and payment conditions.
